<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无意义宇宙中的你 | 信号接收中</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --text-color: #d1d5db;
            --phosphor-green: #4ade80;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: "Noto Serif SC", serif; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 宇宙杂音背景 */
        .cosmic-noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            pointer-events: none; opacity: 0.06;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            animation: noise-shift 0.2s steps(2) infinite;
        }
        @keyframes noise-shift { 0% { transform: translate(0,0); } 100% { transform: translate(4px, 4px); } }

        /* 扫描线 */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* 容器 */
        #app {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .screen {
            display: none; width: 100%; max-width: 800px; padding: 2rem; box-sizing: border-box;
            animation: fadeIn 1s ease forwards;
        }
        .screen.active { display: flex; flex-direction: column; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 文字样式 */
        .mono { font-family: 'Space Mono', monospace; font-size: 0.85rem; letter-spacing: 2px; color: var(--phosphor-green); }
        .text-glitch { position: relative; }
        .text-glitch::after {
            content: attr(data-text); position: absolute; left: 2px; text-shadow: -1px 0 #ff00c1;
            top: 0; color: #fff; background: var(--bg-color); overflow: hidden; clip: rect(0,0,0,0);
            animation: glitch 4s infinite linear alternate-reverse;
        }
        @keyframes glitch {
            2% { clip: rect(10px, 999px, 20px, 0); }
            4% { clip: rect(0, 0, 0, 0); }
        }

        .intro-text { font-size: 1.15rem; line-height: 2; text-align: center; color: #9ca3af; }
        .btn-initiate {
            margin-top: 3rem; padding: 1rem 2rem; border: 1px solid var(--phosphor-green);
            color: var(--phosphor-green); cursor: pointer; transition: all 0.3s;
            background: transparent; align-self: center; outline: none;
        }
        .btn-initiate:hover { background: var(--phosphor-green); color: #000; box-shadow: 0 0 20px var(--phosphor-green); }

        /* 问题页 */
        .question-box { margin-bottom: 2.5rem; }
        .question-text { font-size: 1.35rem; font-weight: 700; line-height: 1.7; margin-top: 1rem; color: #f3f4f6; }
        .options-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .option-item {
            padding: 1.2rem; border-left: 2px solid transparent; cursor: pointer;
            transition: all 0.4s ease; color: #9ca3af; font-size: 1.05rem; line-height: 1.5;
        }
        .options-list:hover .option-item { opacity: 0.3; filter: blur(1px); }
        .options-list .option-item:hover { 
            opacity: 1; filter: blur(0); color: #fff; border-left: 2px solid var(--phosphor-green); 
            padding-left: 1.8rem; background: rgba(255,255,255,0.03); transform: translateX(5px);
        }

        /* 示波器 */
        #oscilloscope {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 250px;
            z-index: 5; pointer-events: none;
        }

        /* 结果页 - 修复滚动条与展示问题 */
        #screen-result { 
            overflow-y: auto; height: 100vh; justify-content: flex-start; 
            padding-top: 3rem; padding-bottom: 6rem; align-items: center;
            -webkit-overflow-scrolling: touch; /* iOS 顺滑滚动 */
        }
        /* 隐藏滚动条但保留滚动功能 */
        #screen-result::-webkit-scrollbar { width: 0; background: transparent; }
        
        .result-actions { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; align-items: center; margin-bottom: 4rem; }
        
        #poster-img { 
            width: 90%; max-width: 450px; border-radius: 6px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.6); display: block; margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="cosmic-noise"></div>
    <div class="scanlines"></div>
    <canvas id="oscilloscope"></canvas>

    <div id="app">
        <!-- 首页 -->
        <div id="screen-home" class="screen active">
            <div class="intro-text">
                NASA 发现了数千颗系外行星。<br>
                有些过热，有些冰冷；<br>有些在宜居带边缘沉默运行；<br>
                有些被重新定义，却仍然完整。<br><br>
                我们不是单一的人格标签。<br>
                我们是温度、轨道、大气、引力组成的行星系统。<br><br>
                请不要选择你希望成为的自己。<br>
                请选择你在深夜、疲惫、孤独时，<br>最接近的自己。
            </div>
            <button class="btn-initiate mono text-glitch" data-text="[ INITIATE SIGNAL ]" onclick="startTest()">[ INITIATE SIGNAL ]</button>
        </div>

        <!-- 答题页 -->
        <div id="screen-question" class="screen">
            <div class="mono" id="q-progress">SIGNAL 01/08</div>
            <div class="question-box">
                <div class="question-text" id="q-title"></div>
            </div>
            <div class="options-list" id="opt-list"></div>
        </div>

        <!-- 计算页 -->
        <div id="screen-calc" class="screen" style="align-items:center; justify-content:center;">
            <div class="mono text-glitch" id="calc-status" data-text="DECODING ORBITAL SIGNATURE..." style="font-size: 1.1rem; text-align:center;">DECODING ORBITAL SIGNATURE...</div>
        </div>

        <!-- 结果页 -->
        <div id="screen-result" class="screen">
            <div class="mono" style="margin-bottom:1.5rem; text-align:center; color: #6b7280;">[ 向下滚动查看 | 长按海报保存档案 ]</div>
            <img id="poster-img" src="" alt="星际档案海报">
            <div class="result-actions">
                <button class="btn-initiate mono" onclick="location.reload()" style="margin-top:0;">[ RE-SCAN ]</button>
            </div>
        </div>
    </div>

    let currentQ = 0;
    let scores = { orbital_stability: 0, internal_ocean: 0, atmospheric_defense: 0, stellar_attachment: 0, absurdity_perception: 0, sisyphean_resistance: 0, value_alignment: 0 };

    // --- 不规则示波器引擎 (Irregular Oscilloscope Engine) ---
    const waveCanvas = document.getElementById('oscilloscope');
    const waveCtx = waveCanvas.getContext('2d');
    let waveOffset = 0;
    let amplitude = 12; // 极低的常态振幅
    let targetAmplitude = 12;
    let noiseFactor = 0.5;

    function resizeWave() {
        waveCanvas.width = window.innerWidth;
        waveCanvas.height = 250;
    }
    window.addEventListener('resize', resizeWave);
    resizeWave();

    function drawWave() {
        waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
        
        // 物理阻尼与平滑平息
        amplitude += (targetAmplitude - amplitude) * 0.08;
        if (targetAmplitude > 12) targetAmplitude -= 0.8; // 快速衰减
        noiseFactor = amplitude / 12;

        waveCtx.beginPath();
        waveCtx.lineWidth = 1.8;
        waveCtx.strokeStyle = 'rgba(74, 222, 128, 0.7)';
        waveCtx.shadowBlur = 10;
        waveCtx.shadowColor = '#4ade80';

        const centerY = waveCanvas.height / 2;
        
        for (let x = 0; x < waveCanvas.width; x++) {
            // 叠加多重正弦波产生不规则模拟信号感
            let lf = Math.sin(x * 0.008 + waveOffset * 0.5) * amplitude;
            let mf = Math.sin(x * 0.04 - waveOffset * 1.2) * (amplitude * 0.4);
            let hf = Math.sin(x * 0.15 + waveOffset * 2) * (amplitude * 0.15 * noiseFactor);
            // 细碎电平抖动
            let jitter = (Math.random() - 0.5) * noiseFactor * 4;

            let y = centerY + lf + mf + hf + jitter;
            
            if (x === 0) waveCtx.moveTo(x, y);
            else waveCtx.lineTo(x, y);
        }
        
        waveCtx.stroke();
        waveOffset += 0.04;
        requestAnimationFrame(drawWave);
    }
    drawWave();

    // 触发情绪震荡
    function triggerShock() {
        targetAmplitude = 95; // 瞬间爆发极高振幅
    }

    // --- 流程控制 ---
    function startTest() {
        triggerShock();
        document.getElementById('screen-home').classList.remove('active');
        setTimeout(() => {
            document.getElementById('screen-question').classList.add('active');
            renderQuestion();
        }, 600);
    }

    function renderQuestion() {

        const progText = `SIGNAL ${String(currentQ+1).padStart(2,'0')}/${String(QUESTIONS.length).padStart(2,'0')}`;
        document.getElementById('q-progress').innerText = progText;
        document.getElementById('q-progress').setAttribute('data-text', progText);
        document.getElementById('q-title').innerText = qData.q;
        
        const list = document.getElementById('opt-list');
        list.innerHTML = '';
        qData.opts.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = opt.t;
            div.onclick = () => selectOption(opt.w);
            list.appendChild(div);
        });
    }

    function selectOption(weights) {
        triggerShock();
        for (let k in weights) scores[k] += weights[k];
        
        document.getElementById('screen-question').classList.remove('active');
        setTimeout(() => {
            if (currentQ < QUESTIONS.length - 1) {
                currentQ++;
                renderQuestion();
                document.getElementById('screen-question').classList.add('active');
            } else {
                showCalc();
            }
        }, 500);
    }

    function showCalc() {
        document.getElementById('screen-calc').classList.add('active');
        
        const statuses = ["ANALYZING ATMOSPHERE...", "MAPPING ORBITAL DATA...", "DECRYPTING INNER OCEAN...", "FINALIZING COORDINATES..."];
        let i = 0;
        const intv = setInterval(() => {
            document.getElementById('calc-status').innerText = statuses[i];
            document.getElementById('calc-status').setAttribute('data-text', statuses[i]);
            i++;
            if(i >= statuses.length) {
                clearInterval(intv);
                generateFinalPoster();
            }
        }, 900);
    }

    // --- 海报生成引擎 2.0 ---
    function generateFinalPoster() {
        // 余弦相似度匹配算法
        let bestPlanet = null;
        let maxSimilarity = -Infinity;

        for (let key in PLANET_CONFIGS) {
            let p = PLANET_CONFIGS[key];
            let dotProduct = 0, normA = 0, normB = 0;
            for (let dim in scores) {
                let valA = scores[dim] || 0;
                // 放大基准分适应少量题库
                let valB = (p.dimensions[dim] || 3) * (QUESTIONS.length / 5); 
                dotProduct += valA * valB;
                normA += valA * valA;
                normB += valB * valB;
            }
            let sim = dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
            if (sim > maxSimilarity || isNaN(sim)) {
                maxSimilarity = sim;
                bestPlanet = p;
            }
        }

        // 防止计算全是0的情况
        if(!bestPlanet) bestPlanet = PLANET_CONFIGS["Europa"];

        // Canvas绘制
        const canvas = document.createElement('canvas');
        canvas.width = 800; canvas.height = 1350; // 加长海报以容纳全部文字
        const ctx = canvas.getContext('2d');

        // 纯黑背景
        ctx.fillStyle = '#050507';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制宇宙星尘噪点
        for(let i=0; i<600; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.4})`;
            ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.5, Math.random()*1.5);
        }

        // 专属星球色晕背景
        const grad = ctx.createRadialGradient(400, 380, 50, 400, 380, 400);
        grad.addColorStop(0, bestPlanet.color + '33');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, 800);

        // 绘制雷达图
        drawRadar(ctx, 400, 380, 160, bestPlanet.color, scores);

        // --- 文本渲染排版 ---
        ctx.textAlign = 'center';
        
        // 坐标编号
        ctx.fillStyle = bestPlanet.color;
        ctx.font = "18px 'Space Mono', monospace";
        ctx.fillText(`COORDINATE ESTABLISHED // ${bestPlanet.id}`, 400, 700);

        // 星球名称
        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 64px 'Noto Serif SC', serif";
        ctx.fillText(bestPlanet.name, 400, 780);

        // 称号
        ctx.fillStyle = bestPlanet.color;
        ctx.font = "italic 32px 'Noto Serif SC', serif";
        ctx.fillText(`—— ${bestPlanet.title} ——`, 400, 840);

        // 核心心理引言金句
        ctx.fillStyle = '#f3f4f6';
        ctx.font = "26px 'Noto Serif SC', serif";
        let nextY = wrapText(ctx, bestPlanet.quote, 400, 930, 600, 42);

        // 底部装饰线
        ctx.strokeStyle = bestPlanet.secondary;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(350, nextY + 30); ctx.lineTo(450, nextY + 30); ctx.stroke();
        
        ctx.fillStyle = '#6b7280';
        ctx.font = "14px 'Space Mono', monospace";
        ctx.fillText(`SYSTEM.LOG.END // GRAVITY COLLAPSE`, 400, nextY + 70);

        // 渲染到页面
        document.getElementById('poster-img').src = canvas.toDataURL('image/png');
        document.getElementById('screen-calc').classList.remove('active');
        document.getElementById('screen-result').classList.add('active');
    }

    function drawRadar(ctx, cx, cy, radius, color, userScores) {
        const axes = 7;
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        
        // 绘制八角网格
        for(let j=1; j<=3; j++) {
            ctx.beginPath();
            let r = radius * (j/3);
            for(let i=0; i<=axes; i++) {
                let angle = (Math.PI*2/axes)*i - Math.PI/2;
                if(i===0) ctx.moveTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
                else ctx.lineTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
            }
            ctx.stroke();
        }

        // 骨架线
        for(let i=0; i<axes; i++) {
            let angle = (Math.PI*2/axes)*i - Math.PI/2;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius);
            ctx.stroke();
        }

        // 提取分数绘制个人图形
        let maxScore = 15; // 基准峰值
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.fillStyle = color + '2A'; // 增加透明度后缀
        ctx.lineWidth = 3;
        
        let idx = 0;
        for(let dim in userScores) {
            let angle = (Math.PI*2/axes)*idx - Math.PI/2;
            let val = Math.abs(userScores[dim] || 0);
            let r = radius * (val / maxScore);
            // 保证最小形状并加上一点随机抖动让多边形更自然
            r = Math.max(30, Math.min(radius, r * (0.8 + Math.random()*0.4))); 

            if(idx===0) ctx.moveTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
            else ctx.lineTo(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r);
            idx++;
        }
        ctx.closePath();
        ctx.fill(); 
        ctx.stroke();
        
        // 顶点发光点
        idx = 0;
        for(let dim in userScores) {
            let angle = (Math.PI*2/axes)*idx - Math.PI/2;
            let val = Math.abs(userScores[dim] || 0);
            let r = radius * (val / maxScore);
            r = Math.max(30, Math.min(radius, r * (0.8 + Math.random()*0.4))); 
            
            ctx.beginPath();
            ctx.arc(cx + Math.cos(angle)*r, cy + Math.sin(angle)*r, 4, 0, Math.PI*2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            idx++;
        }
    }

    // 换行渲染文字辅助函数
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split('');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n];
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n];
                y += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line, x, y);
        return y; // 返回最终的Y坐标高度
    }
</script>
